name: Check In

# 签到续期：重置 7 天计时，保持 "Get Hot News" 正常运行
# 原设计为手动运行，这里追加每 5 天自动运行一次（schedule），手动触发保留

on:
  workflow_dispatch:
  schedule:
    # 每 5 天 UTC 01:23 运行一次（北京时间 09:23）
    - cron: "23 1 */5 * *"

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
